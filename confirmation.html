<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Подтверждение записи — Гамаюн Керамика</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css?v=20260825-3"></head>
<body class="admin-body"><main class="confirmation-shell"><header class="site-header"><a class="brand" href="index.html">Гамаюн <span>Керамика</span></a><a class="back-link" href="calendar.html">← Изменить время</a></header><section class="confirmation-card"><p class="eyebrow">Шаг 4 из 4</p><h1>Проверьте<br><em>запись</em></h1><p class="confirmation-lead">Посмотрите детали ещё раз, оставьте контакты — затем оплатите занятие.</p><div id="booking-review" class="booking-review"></div><form id="contact-details" class="contact-details"><p class="eyebrow">Контактные данные</p><h2>Как с вами связаться</h2><div class="contact-grid"><label>Фамилия<input name="lastName" required autocomplete="family-name"></label><label>Имя<input name="firstName" required autocomplete="given-name"></label><label>Отчество<input name="middleName" required autocomplete="additional-name"></label><label>Телефон<input name="phone" type="tel" required autocomplete="tel" placeholder="+7 (___) ___-__-__"></label></div><label>Электронная почта<input name="email" type="email" required autocomplete="email"></label></form><div class="payment-box"><div><p class="eyebrow">Оплата</p><h2>Оплатить онлайн</h2><p>Безопасная оплата картой или через СБП.</p></div><button id="pay-booking" class="button" type="button">Оплатить <span>→</span></button><p class="payment-note">После оплаты запись сразу появится в личном кабинете.</p></div></section></main><script src="js/confirmation.js"></script></body></html>
