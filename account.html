<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Аккаунт — Гамаюн Керамика</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css?v=20260921-final"></head>
<body class="admin-body"><main class="account-shell"><header class="site-header"><a class="brand" href="index.html">Гамаюн <span>Керамика</span></a><a class="back-link" href="index.html">← На главную</a></header>
<section id="auth-card" class="account-card"><p class="eyebrow">Личный кабинет</p><h1>Ваши встречи<br><em>с глиной</em></h1><div class="account-tabs" role="tablist"><button class="is-active" type="button" data-account-tab="login">Войти</button><button type="button" data-account-tab="register">Регистрация</button></div><form id="login-account" class="account-form"><label>Электронная почта<input type="email" required placeholder="you@email.ru"></label><label>Пароль<input type="password" required placeholder="••••••••"></label><button class="button" type="submit">Войти <span>→</span></button><div class="social-auth"><p>или войдите через</p><div><button class="social-button vk" type="button" data-social="VK" aria-label="Войти через VK"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/VK_logo.svg/3840px-VK_logo.svg.png" alt=""></button><button class="social-button max" type="button" data-social="MAX" aria-label="Войти через MAX"><img src="https://upload.wikimedia.org/wikipedia/commons/7/75/Max_logo_2025.png" alt=""></button><button class="social-button mail" type="button" data-social="Mail" aria-label="Войти через Mail"><img src="images/mail-logo.webp" alt=""></button></div></div></form><form id="register-account" class="account-form" hidden><label>Имя<input type="text" required placeholder="Ваше имя"></label><label>Электронная почта<input type="email" required placeholder="you@email.ru"></label><label>Пароль<input type="password" required placeholder="Минимум 8 символов"></label><button class="button" type="submit">Создать аккаунт <span>→</span></button></form><p id="account-note" class="account-note">В демо-версии вход пока не создаёт настоящий аккаунт.</p></section>
<section id="account-dashboard" class="account-card account-dashboard" hidden><p class="eyebrow">Личный кабинет</p><h1>Здравствуйте,<br><em id="dashboard-name">гость</em></h1><p class="dashboard-email" id="dashboard-email"></p><div class="booking-list"><div class="booking-list-heading"><h2>Мои бронирования</h2><a class="text-link" href="booking.html">Записаться</a></div><div id="my-bookings" class="my-bookings"></div></div><button id="account-logout" class="admin-reset" type="button">Выйти из аккаунта</button></section></main><script src="js/account.js?v=20260921-final"></script></body></html>
